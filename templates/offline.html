<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estacle — Offline</title>
<style>
  :root { font-family: Inter, system-ui, -apple-system, sans-serif; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0; padding: 24px;
  }
  .card {
    max-width: 420px; width: 100%; background: #1e293b; border: 1px solid #334155;
    border-radius: 18px; padding: 28px 26px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; background: #f59e0b;
    display: inline-block; margin-right: 8px; box-shadow: 0 0 0 4px rgba(245,158,11,.2);
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 14px; color: #94a3b8; line-height: 1.55; font-size: 14px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button, a.btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 13.5px;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
  }
  .primary { background: #4f46e5; color: #fff; }
  .ghost { background: #334155; color: #e2e8f0; }
  .status { font-size: 12.5px; color: #fbbf24; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>You're offline</h1>
    <p>
      Estacle switched to offline mode because the network is unavailable.
      Pages you already opened may still load from cache. New server actions
      will work again when you're back online.
    </p>
    <div class="actions">
      <button class="primary" type="button" onclick="tryReconnect()">Try again</button>
      <a class="btn ghost" href="/admin/dashboard">Open dashboard (cached)</a>
    </div>
    <p class="status" id="netStatus">Status: offline</p>
  </div>
<script>
function updateStatus() {
  var el = document.getElementById('netStatus');
  if (!el) return;
  el.textContent = navigator.onLine ? 'Status: online — reconnecting…' : 'Status: offline';
  if (navigator.onLine) {
    try { localStorage.setItem('estacle_net', 'online'); } catch (e) {}
  } else {
    try { localStorage.setItem('estacle_net', 'offline'); } catch (e) {}
  }
}
function tryReconnect() {
  updateStatus();
  if (navigator.onLine) {
    location.href = '/admin/dashboard';
  } else {
    location.reload();
  }
}
window.addEventListener('online', function () {
  updateStatus();
  setTimeout(function () { location.href = '/admin/dashboard'; }, 400);
});
window.addEventListener('offline', updateStatus);
updateStatus();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function () {});
}
</script>
</body>
</html>
